name: Tear down PR preview

on:
  pull_request:
    types: [closed]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RELEASE_NAME: pr-${{ github.event.pull_request.number }}
  NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to OpenShift
        run: |
          oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}"

      - name: Helm uninstall
        run: |
          helm uninstall "$RELEASE_NAME" --namespace "$NAMESPACE" || echo "release not found, skipping"

      - name: Remove pushed image tag from GHCR
        # Best-effort: GHCR_PAT also needs delete:packages for this to work.
        # Doesn't fail the job if it can't find/delete the version, since the
        # helm uninstall above is the part that actually matters.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          PACKAGE=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for scope in orgs users; do
            VERSION_ID=$(gh api "/${scope}/$OWNER/packages/container/$PACKAGE/versions" --paginate 2>/dev/null \
              | jq -r --arg sha "$SHA" '.[] | select(.metadata.container.tags[]? == $sha) | .id' | head -n1)
            if [ -n "$VERSION_ID" ]; then
              gh api --method DELETE "/${scope}/$OWNER/packages/container/$PACKAGE/versions/$VERSION_ID"
              break
            fi
          done
