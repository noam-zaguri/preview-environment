name: Deploy preview-environment dashboard

# Prerequisites (see helm/preview-dashboard/README.md):
#   - repo secrets: OPENSHIFT_SERVER, OPENSHIFT_TOKEN, GHCR_USERNAME, GHCR_PAT
#   - repo variable: OPENSHIFT_NAMESPACE
#   - the OPENSHIFT_TOKEN's user needs "admin" role (not just "edit") on
#     OPENSHIFT_NAMESPACE, since the chart creates a Role/RoleBinding
#   - GHCR_PAT is a personal access token with read:packages, used as a
#     long-lived credential the cluster can pull images with (the ephemeral
#     GITHUB_TOKEN only lives for the duration of this job, so it can push
#     but can't be used later by the cluster to pull)
#
# This is a single, permanent release (not spun up per PR): it's the central
# view of every OTHER preview pod in the namespace, via /api/pods, so it needs
# to stay running even when some other preview pod is down.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: preview-environment-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  RELEASE_NAME: preview-environment
  NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to OpenShift
        run: |
          oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Ensure GHCR pull secret exists
        run: |
          oc create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ secrets.GHCR_USERNAME }}" \
            --docker-password="${{ secrets.GHCR_PAT }}" \
            -n "$NAMESPACE" \
            --dry-run=client -o yaml | oc apply -f -

      - name: Ensure ServiceAccount exists and has the pull secret linked
        # Must happen BEFORE `helm upgrade --install`, since the Deployment
        # it creates schedules pods against this ServiceAccount immediately.
        # Done imperatively (not templated in the chart) because OpenShift's
        # own service-account-controller also manages .imagePullSecrets on
        # every ServiceAccount, and having Helm declare/own that same field
        # causes an apply conflict with that controller on every upgrade.
        # Both commands are idempotent -- safe to run on every deploy, and
        # Helm's own (imagePullSecrets-free) ServiceAccount template just
        # applies on top of this without touching that field.
        run: |
          oc create serviceaccount "$RELEASE_NAME" -n "$NAMESPACE" \
            --dry-run=client -o yaml | oc apply -f -
          oc secrets link "$RELEASE_NAME" ghcr-pull-secret --for=pull -n "$NAMESPACE"

      - name: Render values
        run: |
          # Helm accepts JSON as valid YAML, so plain json.dumps (stdlib, no
          # extra deps) is enough here.
          python3 - <<'PY'
          import json
          import os

          sha = os.environ["GITHUB_SHA"]
          values = {
              "image": {
                  "repository": os.environ["IMAGE"],
                  "tag": sha,
              },
              "env": {
                  "commitSha": sha,
                  "mrReleaseId": os.environ["RELEASE_NAME"],
                  "appVersion": sha,
                  "environment": "production",
              },
          }
          with open("dashboard-values.json", "w") as f:
              json.dump(values, f)
          PY

      - name: Helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE_NAME" ./helm/preview-dashboard \
            --namespace "$NAMESPACE" \
            -f dashboard-values.json \
            --wait --timeout 5m

      - name: Print dashboard URL
        run: |
          HOST=$(oc get route "$RELEASE_NAME" -n "$NAMESPACE" -o jsonpath='{.spec.host}')
          echo "### Dashboard deployed: https://$HOST" >> "$GITHUB_STEP_SUMMARY"
