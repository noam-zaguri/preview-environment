apiVersion: v1
kind: Service
metadata:
  name: {{ include "preview-dashboard.fullname" . }}
  labels:
    {{- include "preview-dashboard.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "preview-dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
