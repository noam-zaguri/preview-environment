{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "preview-dashboard.serviceAccountName" . }}
  labels:
    {{- include "preview-dashboard.labels" . | nindent 4 }}
# Deliberately NOT declaring imagePullSecrets here. OpenShift's own
# service-account-controller manages that field on every ServiceAccount to
# auto-attach the internal registry's pull secret, via server-side apply. If
# Helm also declares/owns that same field, the two field managers conflict
# ("Apply failed with 1 conflict: ... service-account-controller: .imagePullSecrets")
# on every upgrade. Instead, `oc secrets link ... --for=pull` attaches the
# GHCR pull secret imperatively after this ServiceAccount is created (see
# .github/workflows/deploy-dashboard.yml), which doesn't fight over ownership.
{{- end }}
