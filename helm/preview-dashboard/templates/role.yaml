{{- if .Values.podStatusRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "preview-dashboard.fullname" . }}-pod-reader
  labels:
    {{- include "preview-dashboard.labels" . | nindent 4 }}
rules:
  # "get" is for the /pod-status self-check; "list" is for /api/pods, which
  # discovers OTHER preview pods by name pattern (see tracked_pods.py).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
{{- end }}
