{{- if .Values.podStatusRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "preview-dashboard.fullname" . }}-pod-reader
  labels:
    {{- include "preview-dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "preview-dashboard.fullname" . }}-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "preview-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
