# Default values for the preview-dashboard chart.
# CI overrides image.repository/tag and env.* via -f <generated-values-file>
# and installs this as a single, permanent "preview-environment" release
# (see .github/workflows/deploy-dashboard.yml) rather than one per PR.

replicaCount: 1

image:
  repository: ghcr.io/CHANGEME/preview-dashboard
  tag: latest
  pullPolicy: IfNotPresent

# Secret(s) the ServiceAccount uses to pull the image from GHCR (see
# "Ensure GHCR pull secret exists" in .github/workflows/deploy-dashboard.yml).
imagePullSecrets:
  - name: ghcr-pull-secret

# Port the app listens on inside the container (maps to the PORT env var main.py reads).
port: 8000

service:
  port: 8000

# OpenShift Route. Leave host empty to let OpenShift generate one
# (<release-name>-<namespace>.<cluster-apps-domain>).
route:
  enabled: true
  host: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Metadata surfaced on the dashboard's own cards (see consts.py for the env
# var names). CI fills these in; empty strings fall back to the app's own
# defaults.
env:
  commitSha: ""
  mrReleaseId: ""
  mrTitle: ""
  appVersion: ""
  environment: "preview"

serviceAccount:
  create: true
  name: ""

# Grants the pod's ServiceAccount "get" (for /pod-status, its own pod) and
# "list" (for /api/pods, discovering other tracked pods) on pods in this
# namespace. See get_pod_status.py and tracked_pods.py.
podStatusRbac:
  enabled: true

podAnnotations: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
