name: Deploy PR preview

# Copy into your own app's repo (adjust the chart path/name and image
# reference). Deploys into the SAME shared namespace as the central
# preview-environment dashboard, so it shows up there automatically.
#
# Prerequisites:
#   - repo secrets: OPENSHIFT_SERVER, OPENSHIFT_TOKEN, GHCR_USERNAME, GHCR_PAT
#     (only OPENSHIFT_TOKEN needs to be able to write Deployments/Services in
#     the namespace -- "edit" role is enough, unlike the dashboard itself)
#   - repo variable: OPENSHIFT_NAMESPACE (same namespace the dashboard uses)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: write

env:
  RELEASE_NAME: pr-${{ github.event.pull_request.number }}
  NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to OpenShift
        run: |
          oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Render per-PR values
        env:
          MR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Helm accepts JSON as valid YAML, so plain json.dumps (stdlib, no
          # extra deps, safe escaping of the free-form MR title) is enough.
          python3 - <<'PY'
          import json
          import os

          sha = os.environ["GITHUB_SHA"]
          values = {
              "image": {
                  "repository": os.environ["IMAGE"],
                  "tag": sha,
              },
              "tracking": {
                  "releaseId": os.environ["RELEASE_NAME"],
                  "commitSha": sha,
                  "title": os.environ["MR_TITLE"],
                  "version": sha,
              },
          }
          with open("pr-values.json", "w") as f:
              json.dump(values, f)
          PY

      - name: Helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE_NAME" ./helm/sample-app \
            --namespace "$NAMESPACE" \
            -f pr-values.json \
            --wait --timeout 5m

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview pod deployed as \`${{ env.RELEASE_NAME }}\` — check its status on the preview-environment dashboard.`,
            });
